<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>SmoothGPT</title>
    <link rel="stylesheet" href="vendor/tokens.css" />
    <link rel="stylesheet" href="vendor/webext-ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="popup stack">
    <header class="row">
      <span class="title">SmoothGPT</span>
      <span id="status" class="badge">…</span>
    </header>

    <dl class="rows-divided">
      <div class="row">
        <dt>Turns in conversation</dt>
        <dd id="total">—</dd>
      </div>
      <div class="row">
        <dt>Virtualised</dt>
        <dd id="contained">—</dd>
      </div>
      <div class="row">
        <dt>Rendered live</dt>
        <dd id="rendered">—</dd>
      </div>
    </dl>

    <label class="row toggle-row">
      <span>Enabled</span>
      <span class="switch">
        <input type="checkbox" id="toggle" />
        <span class="track"><span class="thumb"></span></span>
      </span>
    </label>

    <p id="hint" class="hint"></p>

    <script src="vendor/webext.js"></script>
    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
